<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B6E">
<title>HMCLEAN - Aplikasi Pelanggan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4F3; --card:#FFFFFF; --teal:#0E6B6E; --teal-press:#0A5255; --cyan:#00A3B4; --cyan-soft:#DDF4F6;
  --field:#F1F0EF; --line:#ECE9E7; --text:#111827; --muted:#6B7280; --amber:#D48806;
  --red:#D92D20; --red-soft:#FEE4E2; --green:#12A150; --green-soft:#DCFCE7; --outer:#1F2937;
  --dis-bg:#E5E7EB; --dis-text:#9CA3AF; --white:#FFFFFF;
  --shadow:0 2px 12px rgba(0,0,0,.06); --shadow-teal:0 6px 16px rgba(14,107,110,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--outer);color:var(--text);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.ic{flex:none;display:block}
.ic.fill path{fill:currentColor}

#phone{position:relative;width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#top{flex:none;position:relative;z-index:3}
#top:empty,#bar:empty,#nav:empty{display:none}
#content{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#content::-webkit-scrollbar{display:none}
#bar{flex:none;background:var(--card);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.04);z-index:2}
#nav{flex:none;z-index:2}

/* top bars */
.topbar{height:60px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 6px;background:var(--bg)}
.topbar.wide-r{grid-template-columns:80px 1fr 80px}
.topbar .t{text-align:center;font-size:17px;font-weight:600;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.solid{background:var(--teal);color:var(--white)}
.topbar.solid .t{color:var(--white)}
.topbar.solid .icon-btn{color:var(--white)}
.topbar.solid .icon-btn:active{background:var(--teal-press)}
.topbar .r{display:flex;justify-content:flex-end;padding-right:8px}
.brandbar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:6px;color:var(--teal);font-weight:700;font-size:18px;letter-spacing:.3px}
.pill{height:36px;padding:0 12px 0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text)}
.pill.ghost-white{background:transparent;border:1.5px solid rgba(255,255,255,.7);color:var(--white);height:32px;padding:0 14px}
.link-btn{color:var(--teal);font-weight:600;font-size:14px}
.link-btn.small{font-size:13px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;position:relative;color:var(--text)}
.icon-btn:active{background:var(--field)}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card);box-sizing:content-box}
.icon-btn .dot{top:9px;right:10px}
.avatar{border-radius:50%;background:var(--cyan);color:var(--white);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden;position:relative}

/* tab bar */
.tabbar{height:68px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);box-sizing:content-box}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);position:relative;text-align:center}
.tab.on{color:var(--teal)}
.tab .dot{top:11px;left:calc(50% + 7px)}

/* layout */
.pad{padding:8px 20px 32px}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:16px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mt28{margin-top:28px}
.center{text-align:center}
.h-page{font-size:22px;font-weight:700;line-height:1.3}
.h-sec{font-size:17px;font-weight:600;line-height:1.35}
.h-card{font-size:16px;font-weight:600;line-height:1.35}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.b600{font-weight:600}.b700{font-weight:700}
.teal{color:var(--teal)}
.red{color:var(--red)}
.green{color:var(--green)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card.p16{padding:16px}
.card.p20{padding:20px}
.divider{height:1px;background:var(--line);margin:14px 0}
.press{transition:transform .12s ease}
.press:active{transform:scale(.98)}

/* buttons */
.btn{height:52px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;padding:0 24px;width:100%;transition:background .15s ease,transform .12s ease;text-align:center;white-space:nowrap}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--teal);color:var(--white);box-shadow:var(--shadow-teal)}
.btn-primary:active{background:var(--teal-press)}
.btn-secondary{background:var(--card);color:var(--teal);border:1.5px solid var(--teal)}
.btn-secondary:active{background:var(--cyan-soft)}
.btn-danger{background:var(--red);color:var(--white)}
.btn-danger-outline{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
.btn-danger-outline:active{background:var(--red-soft)}
.btn-text{background:transparent;color:var(--teal);height:44px}
.btn-sm{height:40px;padding:0 18px;font-size:14px;width:auto}
.btn-outline{background:var(--card);color:var(--teal);border:1.5px solid var(--teal)}
.btn-auto{width:auto}
.btn:disabled,.btn[disabled]{background:var(--dis-bg);color:var(--dis-text);box-shadow:none;border:0;cursor:not-allowed;transform:none}
.btn-row{display:flex;gap:12px}
.btn-row>.btn{flex:1}

/* fields */
.label{font-size:13px;font-weight:600;margin-bottom:8px;display:block}
.field{display:flex;align-items:center;gap:10px;height:52px;background:var(--field);border-radius:14px;padding:0 16px;border:1.5px solid transparent;color:var(--muted);transition:border-color .15s}
.field:focus-within{border-color:var(--teal);background:var(--card)}
.field input,.field select{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:15px}
.field input::placeholder,textarea::placeholder{color:var(--dis-text);text-transform:none}
.field .icon-btn{width:36px;height:36px;margin-right:-8px;color:var(--muted)}
.field.err{border-color:var(--red)}
.field.btnfield{cursor:pointer;width:100%;text-align:left}
.field .prefix{color:var(--text);font-weight:600;padding-right:10px;border-right:1px solid var(--line);height:24px;display:flex;align-items:center}
textarea.area{width:100%;min-height:104px;resize:none;background:var(--field);border:1.5px solid transparent;border-radius:14px;padding:14px 16px;outline:0;font-size:15px;line-height:1.5}
textarea.area:focus{border-color:var(--teal);background:var(--card)}
.err-text{color:var(--red);font-size:13px;margin-top:6px}
.hint{color:var(--muted);font-size:12px;margin-top:6px}
.fgroup+.fgroup{margin-top:18px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.55;cursor:pointer}
.check input{position:absolute;opacity:0;pointer-events:none}
.check .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--dis-text);flex:none;display:grid;place-items:center;color:transparent;background:var(--card);margin-top:1px}
.check input:checked+.box{background:var(--teal);border-color:var(--teal);color:var(--white)}
.check a,.inline-link{color:var(--teal);font-weight:600;text-decoration:none;cursor:pointer}

.alert{border-radius:14px;padding:14px 16px;display:flex;gap:10px;font-size:13px;line-height:1.5}
.alert.red{background:var(--red-soft);color:var(--red)}
.alert.green{background:var(--green-soft);color:var(--green)}
.alert.cyan{background:var(--cyan-soft);color:var(--teal)}
.alert .t{font-weight:700;font-size:14px}
.alert .body{color:var(--text)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.amber{background:var(--amber);color:var(--white)}
.badge.cyan{background:var(--cyan-soft);color:var(--teal)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.teal{background:var(--teal);color:var(--white)}
.badge.solidred{background:var(--red);color:var(--white)}
.badge.gray{background:var(--dis-bg);color:var(--muted)}

/* images */
.imgbox{position:relative;overflow:hidden;background:var(--dis-bg);border-radius:16px}
.imgbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.imgbox .ph{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;font-size:11px;color:var(--muted);padding:0 8px;line-height:1.3}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.66) 0%,rgba(0,0,0,.18) 48%,rgba(0,0,0,0) 70%);pointer-events:none}

/* auth */
.auth-hero{background:var(--teal);color:var(--white);padding:48px 24px 108px;text-align:center}
.auth-hero .logo{font-size:28px;font-weight:700;letter-spacing:.5px}
.auth-hero .sub{opacity:.85;font-size:14px;margin-top:6px}
.auth-card{background:var(--card);border-radius:24px;box-shadow:0 8px 24px rgba(0,0,0,.06);margin:-72px 20px 0;padding:28px 22px;border:1px solid var(--line)}
.reg-hero{background:var(--teal);color:var(--white);padding:8px 24px 76px}
.reg-hero h1{font-size:28px;font-weight:700;line-height:1.25}
.reg-hero p{opacity:.85;font-size:14px;margin-top:8px;max-width:300px}
.or-line{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:22px 0 16px}
.or-line:before,.or-line:after{content:"";flex:1;height:1px;background:var(--line)}
.otp-boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.otp-boxes input{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:center;font-size:22px;font-weight:700;outline:0;width:100%}
.otp-boxes input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--cyan-soft)}
.otp-boxes.err input{border-color:var(--red)}
.icon-tile{width:56px;height:56px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--teal)}
.big-circle{width:120px;height:120px;border-radius:50%;background:var(--cyan-soft);color:var(--teal);display:grid;place-items:center;margin:0 auto}
.req{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.req+.req{margin-top:8px}
.req .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--dis-text);display:grid;place-items:center;color:transparent;flex:none}
.req.ok{color:var(--text)}
.req.ok .ck{background:var(--green);border-color:var(--green);color:var(--white)}

/* home */
.wallet-card{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%}
.circle-ic{width:42px;height:42px;border-radius:50%;background:var(--cyan-soft);color:var(--teal);display:grid;place-items:center;flex:none}
.circle-ic.sm{width:36px;height:36px}
.circle-ic.solid{background:var(--cyan);color:var(--white)}
.addr-picker{width:100%;text-align:left;display:block}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.svc-tile{display:block;width:100%;aspect-ratio:1.42;border-radius:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.svc-tile .imgbox{position:absolute;inset:0}
.svc-tile .name{position:absolute;left:12px;right:12px;bottom:10px;color:var(--white);font-weight:600;font-size:14px;line-height:1.3;text-align:left}
.svc-tile .badge{position:absolute;top:10px;left:10px}
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:4px 20px 12px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.promo{width:86%;height:172px;border-radius:16px;background:var(--teal);display:flex;overflow:hidden;color:var(--white);box-shadow:var(--shadow);text-align:left}
.promo .txt{flex:1;padding:16px;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.promo .imgbox{width:44%;border-radius:0}
.promo .code{display:inline-flex;align-self:flex-start;background:var(--cyan-soft);color:var(--teal);border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px}
.promo .big{font-size:22px;font-weight:700;line-height:1.2}

/* lists */
.menu-item{display:flex;align-items:center;gap:14px;padding:16px;width:100%;text-align:left}
.menu-item+.menu-item{border-top:1px solid var(--line)}
.menu-item .ic-wrap{color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;padding:16px;width:100%;text-align:left;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.opt.on{background:var(--cyan-soft);border-color:var(--teal)}
.opt.dis{opacity:1;background:var(--field);box-shadow:none;cursor:not-allowed}
.opt+.opt{margin-top:12px}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--dis-text);flex:none;display:grid;place-items:center;background:var(--card)}
.on .radio{border-color:var(--teal)}
.on .radio:after{content:"";width:12px;height:12px;border-radius:50%;background:var(--teal)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--teal);color:var(--teal);display:grid;place-items:center;background:var(--card)}
.stepper button:disabled{border-color:var(--dis-bg);color:var(--dis-text);cursor:not-allowed}
.stepper .v{font-size:18px;font-weight:700;min-width:16px;text-align:center}

/* offers */
.offer{width:250px;display:flex;gap:12px;padding:14px;text-align:left;align-items:flex-start}

/* schedule */
.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gender{position:relative;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);font-weight:600;font-size:14px}
.gender .circle-ic{width:48px;height:48px}
.gender.on{background:var(--cyan-soft);border-color:var(--teal)}
.gender.on .circle-ic{background:var(--teal);color:var(--white)}
.gender .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:var(--white);display:grid;place-items:center}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--card);color:var(--text)}
.cal-nav button:disabled{color:var(--dis-text);cursor:not-allowed}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 2px;margin-top:14px;text-align:center}
.cal-grid .dow{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:6px}
.cal-grid .dow.sun{color:var(--red)}
.day{height:42px;border-radius:12px;font-size:14px;font-weight:600;display:grid;place-items:center;position:relative;color:var(--text);width:100%}
.day:disabled{color:var(--dis-text);cursor:not-allowed;font-weight:500}
.day.today{color:var(--teal)}
.day.full .fdot{position:absolute;bottom:5px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.day.on{background:var(--teal);color:var(--white)}
.day.on .fdot{background:var(--white)}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hour{text-align:center;height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.hour.on{background:var(--cyan-soft);border-color:var(--teal);color:var(--teal)}
.hour:disabled{background:var(--dis-bg);border-color:var(--dis-bg);color:var(--dis-text);cursor:not-allowed}

/* order */
.ocard{padding:16px;cursor:pointer}
.ocard+.ocard{margin-top:16px}
.o-svc{color:var(--cyan);font-weight:600;font-size:14px}
.o-id{font-weight:600;font-size:15px;margin:2px 0 6px}
.o-total{color:var(--teal);font-weight:700;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--line)}
.seg button{height:46px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;position:relative}
.seg button.on{color:var(--teal)}
.seg button.on:after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2.5px;border-radius:2px;background:var(--teal)}
.progress{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.pstep{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);position:relative;line-height:1.3}
.pstep .pd{width:28px;height:28px;border-radius:50%;background:var(--dis-bg);color:var(--dis-text);display:grid;place-items:center;z-index:1}
.pstep.done .pd{background:var(--teal);color:var(--white)}
.pstep.cur .pd{background:var(--cyan-soft);color:var(--teal);border:2px solid var(--teal)}
.pstep.done,.pstep.cur{color:var(--text)}
.pstep:not(:first-child):before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--dis-bg)}
.pstep.done:not(:first-child):before,.pstep.cur:not(:first-child):before{background:var(--teal)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv+.kv{margin-top:10px}
.kv .k{color:var(--muted)}
.kv .v{text-align:right;font-weight:500;white-space:nowrap}
.kv.total{font-size:16px;font-weight:700}
.kv.total .k{color:var(--text)}
.kv.total .v{color:var(--teal);font-weight:700;font-size:18px}
.demo-box{border:1.5px dashed var(--dis-text);border-radius:16px;padding:14px;background:var(--card)}
.code-box{background:var(--field);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.code-box .code{font-size:19px;font-weight:700;letter-spacing:.5px;word-break:break-all}
.countdown{font-size:30px;font-weight:700;color:var(--teal);letter-spacing:1px}
.steps-list{counter-reset:s;list-style:none}
.steps-list li{position:relative;padding-left:36px;font-size:14px;line-height:1.5}
.steps-list li+li{margin-top:12px}
.steps-list li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--cyan-soft);color:var(--teal);font-size:12px;font-weight:700;display:grid;place-items:center}

/* empty */
.empty{text-align:center;padding:48px 16px}
.empty .circ{width:112px;height:112px;border-radius:50%;background:var(--cyan-soft);color:var(--teal);display:grid;place-items:center;margin:0 auto 20px}
.empty h3{font-size:17px;font-weight:600}
.empty p{color:var(--muted);font-size:14px;margin:6px auto 20px;max-width:280px}

/* wallet / topup */
.amount-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amt{text-align:center;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.amt small{font-weight:500;font-size:12px;color:var(--muted);margin-left:3px}
.amt.on{border-color:var(--teal);background:var(--cyan-soft);color:var(--teal)}
.pm-logo{width:42px;height:32px;border-radius:8px;background:var(--cyan-soft);color:var(--teal);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;letter-spacing:.3px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{text-align:center;height:36px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--teal);border-color:var(--teal);color:var(--white)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:12px;padding:16px 20px 24px}
.msg{max-width:78%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-wrap:break-word}
.msg .tm{font-size:11px;margin-top:4px;opacity:.7;text-align:right}
.msg.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start;box-shadow:var(--shadow)}
.msg.me{background:var(--teal);color:var(--white);border-bottom-right-radius:6px;align-self:flex-end}
.msg .who{color:var(--cyan);font-weight:600;font-size:12px;margin-bottom:2px}
.chat-input{display:flex;gap:10px;align-items:center}
.chat-input .field{flex:1;height:48px;border-radius:999px}
.send{width:48px;height:48px;border-radius:50%;background:var(--teal);color:var(--white);display:grid;place-items:center;flex:none}
.send:disabled{background:var(--dis-bg);color:var(--dis-text)}
.typing{align-self:flex-start;color:var(--muted);font-size:13px}

/* account */
.prog{height:8px;border-radius:999px;background:var(--dis-bg);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .4s ease}
.toggle{width:48px;height:28px;border-radius:999px;background:var(--dis-bg);position:relative;flex:none;transition:background .15s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--white);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .15s}
.toggle.on{background:var(--teal)}
.toggle.on:after{transform:translateX(20px)}
.toggle:disabled{cursor:not-allowed}
.vcard{display:flex;overflow:hidden;padding:0;position:relative}
.vcard .stripe{width:5px;flex:none}
.vcard .imgbox{width:92px;height:92px;flex:none;margin:12px 0 12px 12px;border-radius:12px}
.vcard .vbody{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column}
.addr-card{padding:16px}
.addr-card+.addr-card{margin-top:16px}
.notif{display:flex;gap:12px;padding:16px;cursor:pointer;width:100%;text-align:left}
.notif+.notif{margin-top:12px}
.notif.unread{border-color:var(--cyan)}
.doc h3{font-size:16px;font-weight:600;margin:18px 0 6px}
.doc h3:first-child{margin-top:0}
.doc p{font-size:14px;color:var(--text);line-height:1.65}
.doc p+p{margin-top:10px}
.stars{display:flex;gap:2px;color:var(--amber)}
.star-pick{display:flex;gap:10px;justify-content:center}
.star-pick button{color:var(--dis-text)}
.star-pick button.on{color:var(--amber)}
.cat-grid{display:flex;flex-wrap:wrap;gap:8px}
.support-banner{background:var(--teal);color:var(--white);border-radius:16px;padding:24px 20px;text-align:center}

/* overlays */
#overlay{position:absolute;inset:0;z-index:20;display:none}
#overlay.show{display:block}
.scrim{position:absolute;inset:0;background:rgba(17,24,39,.45);opacity:0;transition:opacity .2s ease}
#overlay.in .scrim{opacity:1}
.modal{position:absolute;left:24px;right:24px;top:50%;transform:translate(0,-46%);opacity:0;background:var(--card);border-radius:24px;padding:24px;transition:all .2s ease;text-align:center}
#overlay.in .modal{transform:translate(0,-50%);opacity:1}
.modal h3{font-size:18px;font-weight:700}
.modal p{color:var(--muted);font-size:14px;margin:8px 0 22px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;max-height:86%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
#overlay.in .sheet{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--dis-bg);margin:10px auto 4px;flex:none}
.sheet .sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 6px 20px;flex:none}
.sheet .sh-body{overflow-y:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
#toast{position:absolute;left:20px;right:20px;top:68px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast .tw{background:var(--text);color:var(--white);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;transform:translateY(-8px);transition:all .2s ease;text-align:center;max-width:100%}
#toast.show .tw{opacity:1;transform:translateY(0)}
</style>
</head>

function hitungDiskon(code, svcId, subtotal){
  const v = VOUCHERS[code];
  if (!v) return { ok:false, alasan:'Kode promo tidak valid' };
  const mv = D().myV.find(x => x.code === code);
  if (mv && mv.exp < Date.now()) return { ok:false, alasan:'Voucher sudah kedaluwarsa' };
  if (v.svc && v.svc !== svcId) return { ok:false, alasan:`Hanya berlaku untuk ${svcById(v.svc).nama}` };
  if (subtotal < v.min) return { ok:false, alasan:`Minimal subtotal ${rupiah(v.min)}` };
  let dsk = v.tipe === 'pct' ? Math.round(subtotal * v.nilai / 100) : v.nilai;
  if (v.maks) dsk = Math.min(dsk, v.maks);
  dsk = Math.min(dsk, subtotal);
  return { ok:true, diskon:dsk };
}
function rincianDraft(){
  const dr = app.draft;
  const harga = svcById(dr.svc).harga;
  const subtotal = harga * dr.durasi * dr.helper;
  let diskon = 0;
  if (dr.voucher){
    const h = hitungDiskon(dr.voucher, dr.svc, subtotal);
    if (h.ok) diskon = h.diskon; else dr.voucher = null;
  }
  return { harga, subtotal, diskon, total:subtotal - diskon };
}

/* ticker: hitung mundur, batas waktu bayar */
setInterval(() => {
  if (!app.user) { perbaruiOtpTimer(); return; }
  const now = Date.now(); let berubah = false;
  D().orders.forEach(o => {
    if (o.status === 'Menunggu Pembayaran' && o.deadline && o.deadline <= now){
      o.status = 'Dibatalkan'; o.alasanBatal = 'Waktu pembayaran habis'; o.deadline = null; berubah = true;
      if (o.voucher && !D().myV.some(v => v.code === o.voucher)) D().myV.push({ code:o.voucher, exp:vExp(o.voucher) });
      tambahNotif(`Pesanan ${o.id} dibatalkan`, 'Waktu pembayaran habis.', o.id);
    }
  });
  D().topups.forEach(t => {
    if (t.status === 'Dalam Proses' && t.deadline && t.deadline <= now){ t.status = 'Gagal'; t.deadline = null; berubah = true; }
  });
  if (berubah){
    if (!$('#overlay').classList.contains('show')) render();
    toast('Waktu pembayaran habis');
  }
  document.querySelectorAll('[data-deadline]').forEach(el => { el.textContent = hitungMundur(+el.dataset.deadline - now); });
  perbaruiOtpTimer();
}, 1000);

  const a = cariAkun(app.form.kontak);
  if (!a || a.pw !== app.form.pw){ app.errors = { login:'Email, nomor telepon, atau kata sandi salah' }; render(); return; }
  app.user = a; app.form = {}; app.errors = {};
  pindahHalaman('home', {}, { root:true });
  toast(`Selamat datang, ${a.nama}`);
}
function loginSosial(n){ toast(`Masuk dengan ${n} belum tersedia pada prototipe`); }
function daftar(){
  const f = app.form, e = {};
  if (!String(f.nama || '').trim()) e.nama = 'Nama lengkap wajib diisi';
  if (!String(f.email || '').trim()) e.email = 'Email wajib diisi';
  else if (!emailValid(f.email)) e.email = 'Format email tidak valid';
  const hp = normHp(f.hp);
  if (!String(f.hp || '').trim()) e.hp = 'Nomor telepon wajib diisi';
  else if (!/^08\d{8,12}$/.test(hp)) e.hp = 'Nomor telepon tidak valid';
  if (!f.pw) e.pw = 'Kata sandi wajib diisi';
  else if (f.pw.length < 8) e.pw = 'Kata sandi minimal 8 karakter';
  if (!f.setuju) e.setuju = 'Anda harus menyetujui Syarat & Ketentuan';
  if (!e.email && !e.hp && (cariAkun(f.email) || cariAkun(hp))) e.umum = 'Email atau nomor telepon sudah terdaftar';
  app.errors = e;
  if (Object.keys(e).length){ render(); return; }
  app.otp = { mode:'register', via:'sms', tujuan:samarHp(hp), data:{ nama:f.nama.trim(), email:f.email.trim(), hp, pw:f.pw }, resendAt:Date.now() + 60000, error:'' };
  pindahHalaman('otp');
  toast('Kode verifikasi telah dikirim');
}
function kirimLupa(){
  const v = String(app.form.lupa || '').trim();
  if (!v){ app.errors = { lupa:'Masukkan email atau nomor telepon' }; render(); return; }
  const a = cariAkun(v);
  if (!a){ app.errors = { lupa:'Akun tidak ditemukan' }; render(); return; }
  const viaEmail = v.includes('@');
  app.otp = { mode:'forgot', via:viaEmail ? 'email' : 'sms', tujuan:viaEmail ? samarEmail(a.email) : samarHp(a.hp), akun:a, resendAt:Date.now() + 60000, error:'' };
  app.errors = {};
  pindahHalaman('otp');
  toast('Kode verifikasi telah dikirim');
}
function otpIn(i, el){
  el.value = el.value.replace(/\D/g, '');
  if (el.value.length > 1){
    const digits = el.value.split('');
    const boxes = document.querySelectorAll('.otp-boxes input');
    digits.forEach((dgt, k) => { if (boxes[i + k]) boxes[i + k].value = dgt; });
    const nxt = boxes[Math.min(i + digits.length, 5)]; nxt && nxt.focus();
  } else if (el.value && el.nextElementSibling) el.nextElementSibling.focus();
  cekOtpLengkap();
}
function otpKey(i, el, ev){
  if (ev.key === 'Backspace' && !el.value && el.previousElementSibling){ el.previousElementSibling.focus(); el.previousElementSibling.value = ''; cekOtpLengkap(); }
}
function kodeOtp(){ return Array.from(document.querySelectorAll('.otp-boxes input')).map(i => i.value).join(''); }
function cekOtpLengkap(){
  const b = $('#btnOtp'); if (b) b.disabled = kodeOtp().length !== 6;
  if (kodeOtp().length){ const box = $('.otp-boxes'); if (box) box.classList.remove('err'); const er = $('#otpErr'); if (er) er.textContent = ''; }
}
function perbaruiOtpTimer(){
  const el = $('#resend'); if (!el || !app.otp) return;
  const sisa = app.otp.resendAt - Date.now();
  el.innerHTML = sisa > 0 ? `<span class="muted">Kirim ulang (${hitungMundur(sisa)})</span>` : `<button class="link-btn" onclick="kirimUlang()">Kirim ulang</button>`;
}
function kirimUlang(){ app.otp.resendAt = Date.now() + 60000; perbaruiOtpTimer(); toast('Kode verifikasi telah dikirim ulang'); }
function verifikasiOtp(){
  if (kodeOtp() !== '123456'){
    app.otp.error = 'Kode verifikasi salah';
    const er = $('#otpErr'); if (er) er.textContent = app.otp.error;
    const box = $('.otp-boxes'); if (box) box.classList.add('err');
    document.querySelectorAll('.otp-boxes input').forEach(i => i.value = '');
    const first = $('.otp-boxes input'); if (first) first.focus();
    const b = $('#btnOtp'); if (b) b.disabled = true;
    return;
  }
  if (app.otp.mode === 'register'){
    const d = app.otp.data;
    const akun = { nama:d.nama, email:d.email, hp:d.hp, gender:'', lahir:'', pw:d.pw, data:dataAwal(false, d.nama) };
    app.accounts.push(akun);
    app.user = akun; app.otp = null; app.form = {}; app.errors = {};
    pindahHalaman('home', {}, { root:true });
    toast('Akun berhasil dibuat');
  } else {
    app.form = {}; app.errors = {};
    pindahHalaman('reset', {}, { replace:true });
  }
}
function syaratPw(p){ return [p.length >= 8, /[A-Za-z]/.test(p) && /\d/.test(p), /[^A-Za-z0-9]/.test(p)]; }
function cekReset(){
  const p = app.form.pw1 || '', q = app.form.pw2 || '';
  const s = syaratPw(p);
  document.querySelectorAll('.req').forEach((el, i) => el.classList.toggle('ok', s[i]));
  const cocok = q.length > 0 && p === q;
  const m = $('#mismatch'); if (m) m.textContent = q.length && p !== q ? 'Konfirmasi kata sandi tidak sama' : '';
  const b = $('#btnReset'); if (b) b.disabled = !(s.every(Boolean) && cocok);
}
function simpanReset(){
  const p = app.form.pw1 || '';
  if (!(syaratPw(p).every(Boolean) && p === app.form.pw2)) return;
  app.otp.akun.pw = p; app.otp = null; app.form = {}; app.errors = {};
  pindahHalaman('login', {}, { root:true });
  toast('Kata sandi berhasil diperbarui. Silakan masuk.');
}

/* =========================================================
   JADWAL
   ========================================================= */
const TGL_PENUH = () => ymd(geserHari(3));
function jamTersedia(tgl, h){
  const d = dariYmd(tgl, h);
  return d.getTime() > Date.now() + 30 * 60000;
}
function tanggalTersedia(tgl){
  const d = dariYmd(tgl);
  if (d < hariIni()) return false;
  for (let h = 8; h <= 15; h++) if (jamTersedia(tgl, h)) return true;
  return false;
}
function gantiBulan(n){
  const j = app.jadwal;
  j.bulan = new Date(j.bulan.getFullYear(), j.bulan.getMonth() + n, 1);
  j.expanded = n !== 0 ? true : j.expanded;
  render();
}
function pilihTanggal(t){
  const j = app.jadwal; j.tanggal = t;
  if (j.jam && !jamTersedia(t, j.jam)) j.jam = null;
  render();
}
function pilihJam(h){ app.jadwal.jam = h; render(); }
function pilihGender(g){ app.jadwal.gender = g; render(); }
function clearJadwal(){
  const j = app.jadwal, now = new Date();
  Object.assign(j, { gender:null, tanggal:null, jam:null, bulan:new Date(now.getFullYear(), now.getMonth(), 1), expanded:false });
  render(); toast('Pilihan jadwal dikosongkan');
}
function jadwalSiap(){
  const j = app.jadwal;
  return !!(j.gender && j.tanggal && j.jam && j.tanggal !== TGL_PENUH() && jamTersedia(j.tanggal, j.jam));
}
function buatPesanan(){
  if (!jadwalSiap()) return;
  const j = app.jadwal;
  if (j.mode === 'reschedule'){
    const o = cariOrder(j.orderId);
    o.tanggal = dariYmd(j.tanggal, j.jam).getTime(); o.gender = j.gender;
    tambahNotif(`Jadwal pesanan ${o.id} diubah`, `Jadwal baru: ${fmtTglHari(new Date(o.tanggal))}, ${fmtJam(j.jam)} WIB.`, o.id);
    kembali(); toast('Jadwal berhasil diubah');
    return;
  }
  const s = app.sel;
  app.draft = { svc:s.svc, durasi:s.durasi, helper:s.helper, catatan:s.catatan, alamat:{ ...alamatAktif() }, tanggal:j.tanggal, jam:j.jam, gender:j.gender, voucher:null, metode:'wallet' };
  pindahHalaman('payment');
}
function reschedule(id){
  const o = cariOrder(id); const d = new Date(o.tanggal);
  app.jadwal = { gender:o.gender, tanggal:ymd(d), jam:d.getHours(), bulan:new Date(d.getFullYear(), d.getMonth(), 1), expanded:true, mode:'reschedule', orderId:id };
  if (!jamTersedia(app.jadwal.tanggal, app.jadwal.jam)){ app.jadwal.tanggal = null; app.jadwal.jam = null; }
  pindahHalaman('schedule');
}

function sheetVoucher(){
  app.sheet = 'voucher';
  const r = rincianDraft(), dr = app.draft;
  const mine = D().myV;
  const list = mine.length ? mine.map(mv => {
    const v = VOUCHERS[mv.code]; const h = hitungDiskon(mv.code, dr.svc, r.subtotal);
    const on = dr.voucher === mv.code;
    return `<button class="opt ${on ? 'on' : ''} ${h.ok ? '' : 'dis'}" ${h.ok ? `onclick="pakaiVoucher('${mv.code}')"` : 'disabled'}>

      ${h.ok ? '<span class="radio"></span>' : ''}</button>`;
  }).join('') : `<div class="alert cyan">${ic('info')}<div class="body">Belum ada voucher di Voucher Saya. Masukkan kode promo di atas.</div></div>`;
  bukaSheet('Pakai Promo atau Voucher', `
    <div class="row gap8"><div class="field grow ${app.voucherErr ? 'err' : ''}">${ic('tag')}<input id="kodeV" placeholder="Masukkan kode promo" value="${esc(app.form.kodeV || '')}" oninput="setF('kodeV',this.value)" style="text-transform:uppercase"></div>
    <button class="btn btn-primary btn-auto" style="height:52px" onclick="pakaiKode()">Pakai</button></div>
    ${app.voucherErr ? `<div class="err-text">${app.voucherErr}</div>` : ''}
    <div class="h-card mt20" style="margin-bottom:12px">Voucher Saya</div>${list}
    ${dr.voucher ? `<button class="btn btn-danger-outline mt20" onclick="lepasVoucher()">Lepas Voucher</button>` : ''}`);
}
function pakaiVoucher(code){
  const r = rincianDraft(); const h = hitungDiskon(code, app.draft.svc, r.subtotal);
  if (!h.ok){ app.voucherErr = h.alasan; sheetVoucher(); return; }
  app.draft.voucher = code; app.voucherErr = ''; app.form.kodeV = '';
  tutupOverlay(); render(); toast(`Voucher ${code} dipakai`);
}
function pakaiKode(){
  const code = String(app.form.kodeV || '').trim().toUpperCase();
  if (!VOUCHERS[code]){ app.voucherErr = 'Kode promo tidak valid'; sheetVoucher(); return; }
  const d = D();
  if (!d.myV.some(v => v.code === code)){
    if (d.availV.includes(code)){
      const r = rincianDraft(); const h = hitungDiskon(code, app.draft.svc, r.subtotal);
      if (!h.ok){ app.voucherErr = h.alasan; sheetVoucher(); return; }
      d.availV = d.availV.filter(c => c !== code); d.myV.push({ code, exp:vExp(code) });
    } else { app.voucherErr = 'Voucher sudah pernah digunakan'; sheetVoucher(); return; }
  }
  pakaiVoucher(code);
}
function lepasVoucher(){ app.draft.voucher = null; tutupOverlay(); render(); toast('Voucher dilepas'); }
function bayarSekarang(){
  const dr = app.draft, d = D(), r = rincianDraft();
  const m = METODE.find(x => x.id === dr.metode);
  if (m.id === 'wallet' && d.saldo < r.total) return;
  const o = { id:'#HMC-' + (nomorOrder++), svc:dr.svc, durasi:dr.durasi, helper:dr.helper, harga:r.harga, subtotal:r.subtotal, diskon:r.diskon, voucher:dr.voucher, total:r.total,
    status:'Menunggu Pembayaran', tanggal:dariYmd(dr.tanggal, dr.jam).getTime(), gender:dr.gender, alamat:dr.alamat, catatan:dr.catatan,
    metode:m.nama, paid:false, mitra:false, dibuat:Date.now() };
  if (dr.voucher) d.myV = d.myV.filter(v => v.code !== dr.voucher);
  d.orders.unshift(o);
  app.draft = null;
  if (m.id === 'wallet'){
    d.saldo -= o.total; o.paid = true; o.status = 'Mencari Mitra';
    tambahNotif(`Pesanan ${o.id} sedang mencari mitra`, `Pembayaran ${rupiah(o.total)} dengan HMWallet berhasil.`, o.id);
    pindahHalaman('success', { id:o.id }, { base:'home' });
  } else {
    o.deadline = Date.now() + 15 * 60000; o.kode = kodeBayar(m.nama);
    tambahNotif(`Pesanan ${o.id} menunggu pembayaran`, `Selesaikan pembayaran ${rupiah(o.total)} melalui ${m.nama} dalam 15 menit.`, o.id);
    pindahHalaman('payinstr', { kind:'order', id:o.id }, { base:'home' });
  }
}
function sudahBayar(kind, id){
  const d = D();
  if (kind === 'order'){
    const o = cariOrder(id); if (!o || o.status !== 'Menunggu Pembayaran') return;
    o.status = 'Mencari Mitra'; o.paid = true; o.deadline = null;
    tambahNotif(`Pesanan ${o.id} sedang mencari mitra`, `Pembayaran ${rupiah(o.total)} melalui ${o.metode} berhasil.`, o.id);
    pindahHalaman('success', { id }, { base:'home' });
  } else {
    const t = d.topups.find(x => x.id === id); if (!t || t.status !== 'Dalam Proses') return;
    t.status = 'Berhasil'; t.deadline = null; d.saldo += t.amount;
    tambahNotif('Top up HMWallet berhasil', `Saldo bertambah ${rupiah(t.amount)} melalui ${t.metode}.`);
    const idx = app.stack.map(s => s.nama).lastIndexOf('topup');
    app.stack = idx > 0 ? app.stack.slice(0, idx) : [{ nama:'home', parameter:{} }];
    const s = app.stack[app.stack.length - 1];
    app.page = s.nama; app.params = s.parameter;
    render(true);
    toast(`Top up ${rupiah(t.amount)} berhasil`);
  }
}
function bayarNanti(kind){
  if (kind === 'order'){ pindahHalaman('unpaid', {}, { base:'history' }); app.histTab = 'Riwayat'; toast('Selesaikan pembayaran sebelum batas waktu'); }
  else { kembali(); toast('Top up menunggu pembayaran'); }
}

   ========================================================= */
const NOMINAL_CEPAT = [50000, 100000, 200000, 300000, 500000, 1000000];
function labelNominal(n){ return n >= 1000000 ? `${n / 1000000}<small>Juta</small>` : `${n / 1000}<small>Ribu</small>`; }
function bukaTopup(){ app.topup = { nominal:50000, metode:null }; pindahHalaman('topup'); }
function pilihNominal(n){ app.topup.nominal = n; render(); }
function inputNominal(el){
  const v = parseInt(el.value.replace(/\D/g, '') || '0', 10);
  app.topup.nominal = v;
  el.value = v ? titik(v) : '';
  perbaruiTopupUI();
}
function hapusNominal(){ app.topup.nominal = 0; render(); }
function nominalValid(){ const n = app.topup.nominal; return n >= 50000 && n <= 1000000; }
function perbaruiTopupUI(){
  document.querySelectorAll('.amt').forEach(b => b.classList.toggle('on', +b.dataset.v === app.topup.nominal));
  const e = $('#nomErr');
  const n = app.topup.nominal;
  if (e) e.textContent = n && !nominalValid() ? (n < 50000 ? 'Nominal minimal Rp 50.000' : 'Nominal maksimal Rp 1.000.000') : '';
  const b = $('#btnTopup');
  if (b){ b.disabled = !(nominalValid() && app.topup.metode); b.innerHTML = `Top Up ${nominalValid() ? rupiah(n) : ''} ${ic('arrowR', 18)}`; }
}
function pilihMetodeTopup(id){ app.topup.metode = id; render(); }
function prosesTopup(){
  if (!(nominalValid() && app.topup.metode)) return;
  const m = METODE.find(x => x.id === app.topup.metode);

function kirimPesan(){

  const tab = app.chatTab, d = D();
  d.chats[tab].push({ dari:'me', teks, t:Date.now() });

  render(); scrollChatBawah();
  const user = app.user;
  setTimeout(() => {
    const dd = user.data;
    const arr = BALASAN[tab];
    dd.chats[tab].push({ dari:'them', teks:arr[dd.replyIdx[tab] % arr.length], t:Date.now() });
    dd.replyIdx[tab]++;
    if (app.typing === tab) app.typing = false;
    if (app.user !== user) return;

      if (!$('#overlay').classList.contains('show')){ const val = $('#chatInp') ? $('#chatInp').value : ''; render(); const i = $('#chatInp'); if (i){ i.value = val; } scrollChatBawah(); }

  }, 1500);
}

function simpanProfil(){
  const f = app.form, e = {}, u = app.user;
  if (!String(f.pNama || '').trim()) e.pNama = 'Nama wajib diisi';
  if (!emailValid(f.pEmail)) e.pEmail = 'Format email tidak valid';
  const hp = normHp(f.pHp);
  if (!/^08\d{8,12}$/.test(hp)) e.pHp = 'Nomor telepon tidak valid';
  const lain = app.accounts.filter(a => a !== u);
  if (!e.pEmail && lain.some(a => a.email.toLowerCase() === f.pEmail.trim().toLowerCase())) e.pEmail = 'Email sudah terdaftar';
  if (!e.pHp && lain.some(a => normHp(a.hp) === hp)) e.pHp = 'Nomor telepon sudah terdaftar';
  if (f.pLahir && new Date(f.pLahir) > new Date()) e.pLahir = 'Tanggal lahir tidak valid';
  app.errors = e;
  if (Object.keys(e).length){ render(); return; }
  u.nama = f.pNama.trim(); u.email = f.pEmail.trim(); u.hp = hp; u.gender = f.pGender || ''; u.lahir = f.pLahir || '';
  let bonus = false;
  if (kelengkapan(u) === 100 && !u.data.poinBonus){ u.data.poinBonus = true; u.data.poin += 50; bonus = true; }
  app.form = {};
  kembali();
  toast(bonus ? 'Profil lengkap, kamu mendapat 50 HMPoin' : 'Profil berhasil diperbarui');
}
function klaimKupon(code){
  const d = D();
  if (!d.availV.includes(code)) return;
  d.availV = d.availV.filter(c => c !== code);
  d.myV.push({ code, exp:vExp(code) });
  render(); toast(`Voucher ${code} berhasil diklaim`);
}
function klaimKode(){
  const code = String(app.form.kKode || '').trim().toUpperCase();
  const d = D();
  if (!code){ app.errors = { kKode:'Masukkan kode promo' }; render(); return; }
  if (!VOUCHERS[code]){ app.errors = { kKode:'Kode promo tidak valid' }; render(); return; }
  if (d.myV.some(v => v.code === code)){ app.errors = { kKode:'Voucher sudah ada di Voucher Saya' }; render(); return; }
  if (!d.availV.includes(code)){ app.errors = { kKode:'Voucher sudah pernah digunakan' }; render(); return; }
  app.errors = {}; app.form.kKode = '';
  klaimKupon(code);
}
function pakaiVoucherSaya(code){ const v = VOUCHERS[code]; bukaLayanan(v.svc || 'gc'); toast(`Pilih voucher ${code} di halaman Pembayaran`); }

  app.form.aUtama = !app.form.aUtama; render();
}
function simpanAlamat(id){
  const f = app.form, e = {};
  if (!String(f.aLabel).trim()) e.aLabel = 'Label alamat wajib diisi';
  if (!String(f.aJalan).trim()) e.aJalan = 'Nama jalan wajib diisi';
  if (!String(f.aKec).trim()) e.aKec = 'Kecamatan wajib diisi';
  if (!f.aKota) e.aKota = 'Pilih kota atau kabupaten';
  if (!/^\d{5}$/.test(String(f.aPos).trim())) e.aPos = 'Kode pos harus 5 digit';
  if (!/^8\d{8,12}$/.test(String(f.aTelp).replace(/\D/g, '').replace(/^0/, ''))) e.aTelp = 'Nomor telepon tidak valid';
  app.errors = e;
  if (Object.keys(e).length){ render(); return; }
  const d = D();
  const data = { label:f.aLabel.trim(), jalan:f.aJalan.trim(), kec:f.aKec.trim().replace(/^Kec\.\s*/i, ''), kota:f.aKota, pos:String(f.aPos).trim(),
    telp:'0' + String(f.aTelp).replace(/\D/g, '').replace(/^0/, ''), tipe:f.aTipe, patokan:String(f.aPatokan || '').trim(), utama:!!f.aUtama };
  if (d.addresses.length === 0 || (id && d.addresses.length === 1)) data.utama = true;
  if (data.utama) d.addresses.forEach(a => a.utama = false);
  if (id){ Object.assign(d.addresses.find(a => a.id === id), data); }
  else { const baru = { id:'a' + Date.now(), ...data }; d.addresses.push(baru); if (!d.activeAddr || d.addresses.length === 1) d.activeAddr = baru.id; }
  if (!d.addresses.some(a => a.utama)) d.addresses[0].utama = true;
  app.form = {};
  kembali(); toast(id ? 'Alamat berhasil diperbarui' : 'Alamat berhasil ditambahkan');
}
function hapusAlamat(id){
  const d = D(); const a = d.addresses.find(x => x.id === id);
  if (a.utama && d.addresses.length > 1){ toast('Alamat utama tidak bisa dihapus selama masih ada alamat lain'); return; }
  konfirmasi({ judul:'Hapus alamat?', pesan:`Alamat "${esc(a.label)}" akan dihapus dari daftar.`, ya:'Hapus', tidak:'Batal', bahaya:true,
    aksi:() => {
      d.addresses = d.addresses.filter(x => x.id !== id);
      if (d.activeAddr === id){ const u = d.addresses.find(x => x.utama) || d.addresses[0]; d.activeAddr = u ? u.id : null; }
      render(); toast('Alamat dihapus');
    } });
}

/* ---------- Jadwal ---------- */
PAGES.schedule = () => {
  const j = app.jadwal;
  const src = j.mode === 'reschedule' ? cariOrder(j.orderId) : app.sel;
  const s = svcById(src.svc);
  const total = j.mode === 'reschedule' ? src.total : s.harga * src.durasi * src.helper;
  const now = new Date(), b = j.bulan;
  const minBulan = new Date(now.getFullYear(), now.getMonth(), 1), maxBulan = new Date(now.getFullYear(), now.getMonth() + 3, 1);
  const awal = b.getDay(), jml = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < awal; i++) cells.push(null);
  for (let i = 1; i <= jml; i++) cells.push(new Date(b.getFullYear(), b.getMonth(), i));
  while (cells.length % 7) cells.push(null);
  let rows = [];
  for (let i = 0; i < cells.length; i += 7) rows.push(cells.slice(i, i + 7));
  if (!j.expanded){
    let start = 0;
    if (b.getTime() === minBulan.getTime()) start = rows.findIndex(r => r.some(c => c && ymd(c) === ymd(now)));
    rows = rows.slice(Math.max(0, start), Math.max(0, start) + 2);
  }
  const penuh = TGL_PENUH();
  const dayBtn = c => {
    if (!c) return '<div></div>';
    const t = ymd(c), ok = tanggalTersedia(t), full = t === penuh;
    return `<button class="day ${j.tanggal === t ? 'on' : ''} ${full ? 'full' : ''} ${t === ymd(now) ? 'today' : ''}" ${ok ? `onclick="pilihTanggal('${t}')"` : 'disabled'} aria-label="${fmtTglPanjang(c)}${full ? ' jadwal penuh' : ''}">${c.getDate()}${full && ok ? '<span class="fdot"></span>' : ''}</button>`;
  };
  const isPenuh = j.tanggal === penuh;
  const ringkas = j.tanggal && j.jam && !isPenuh ? `${fmtTglPanjang(dariYmd(j.tanggal))} (${fmtJam(j.jam)} - ${fmtJam(j.jam + src.durasi)})` : 'Pilih gender, tanggal, dan jam mulai';
  return {
    top:`<div class="topbar solid wide-r"><div class="row"><button class="icon-btn" onclick="kembali()" aria-label="Kembali">${ic('back', 22)}</button></div><div class="t">Jadwal Pengerjaan</div><div class="r"><button class="pill ghost-white" onclick="clearJadwal()">Clear</button></div></div>`,
    body:`<div class="pad" style="padding-top:20px">
      <h2 class="h-sec teal">Pilih Gender Helper</h2><p class="small muted">Tentukan gender helper sesuai keinginanmu.</p>
      <div class="gender-grid mt12">${[['Laki-laki','male'],['Perempuan','female']].map(([g, icn]) => `
        <button class="gender ${j.gender === g ? 'on' : ''}" onclick="pilihGender('${g}')">${j.gender === g ? `<span class="tick">${ic('check', 14)}</span>` : ''}<span class="circle-ic">${ic(icn, 24)}</span>${g}</button>`).join('')}</div>
      <div class="card p16 mt20">
        <div class="cal-head"><div class="h-card teal">${BULAN[b.getMonth()]} ${b.getFullYear()}</div>
          <div class="cal-nav"><button onclick="gantiBulan(-1)" ${b <= minBulan ? 'disabled' : ''} aria-label="Bulan sebelumnya">${ic('chevL', 18)}</button><button onclick="gantiBulan(1)" ${b >= maxBulan ? 'disabled' : ''} aria-label="Bulan berikutnya">${ic('chevR', 18)}</button></div></div>
        <div class="cal-grid">${HARI3.map((h, i) => `<div class="dow ${i === 0 ? 'sun' : ''}">${h.toUpperCase()}</div>`).join('')}${rows.flat().map(dayBtn).join('')}</div>
        <div class="row between mt12"><span class="row gap6 xs muted"><span style="width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block"></span>Jadwal penuh</span>
        <button class="link-btn small row gap4" onclick="app.jadwal.expanded=!app.jadwal.expanded;render()">${j.expanded ? 'Lihat Lebih Sedikit' : 'Lihat Lainnya'} ${ic(j.expanded ? 'chevU' : 'chevD', 16)}</button></div>
      </div>
      ${isPenuh ? `<div class="alert red mt20">${ic('calendarX', 20)}<div><div class="t">Jadwal Penuh</div><div class="body mt4">Maaf, semua helper kami sedang bertugas pada tanggal ini. Silakan pilih tanggal lain yang tersedia.</div></div></div>`
        : `<h2 class="h-sec teal mt24" style="margin-bottom:12px">Pilih Jam Mulai</h2>
        ${j.tanggal ? '' : '<p class="small muted" style="margin:-6px 0 12px">Pilih tanggal terlebih dahulu.</p>'}
        <div class="hours">${[8,9,10,11,12,13,14,15].map(h => `<button class="hour ${j.jam === h ? 'on' : ''}" ${j.tanggal && jamTersedia(j.tanggal, h) ? `onclick="pilihJam(${h})"` : 'disabled'}>${fmtJam(h)}</button>`).join('')}</div>`}
    </div>`,
    bar:`<div class="row gap10" style="margin-bottom:12px"><span class="circle-ic sm">${ic('calendar', 18)}</span><div class="grow"><div class="b600">${src.durasi} Jam ${src.helper} helper · ${s.nama}</div><div class="small muted">${ringkas}</div><div class="small">Total: <b class="teal">${rupiah(total)}</b></div></div></div>
      <button class="btn btn-primary" ${jadwalSiap() ? '' : 'disabled'} onclick="buatPesanan()">${j.mode === 'reschedule' ? 'Simpan Jadwal' : 'Buat Pesanan'}</button>`
  };
};

      <div class="fgroup"><label class="label">Kota / Kabupaten</label><button class="field btnfield ${e.aKota ? 'err' : ''}" onclick="sheetPilih('Kota / Kabupaten','aKota',KOTA)"><span class="grow" style="color:${f.aKota ? 'var(--text)' : 'var(--dis-text)'}">${f.aKota || 'Pilih kota atau kabupaten'}</span>${ic('chevD', 18)}</button>${e.aKota ? `<div class="err-text">${e.aKota}</div>` : ''}</div>
      ${fld('aPos', 'Kode Pos', 'Contoh: 78121', 'inputmode="numeric" maxlength="5"')}
      <div class="fgroup"><label class="label">Nomor Telepon</label><div class="field ${e.aTelp ? 'err' : ''}"><span class="prefix">+62</span><input inputmode="numeric" placeholder="81234567890" value="${esc(f.aTelp || '')}" oninput="setF('aTelp',this.value)"></div>${e.aTelp ? `<div class="err-text">${e.aTelp}</div>` : ''}</div>
      <div class="fgroup"><label class="label">Tipe Bangunan</label><button class="field btnfield" onclick="sheetPilih('Tipe Bangunan','aTipe',TIPE_BANGUNAN)"><span class="grow" style="color:var(--text)">${f.aTipe}</span>${ic('chevD', 18)}</button></div>
      <div class="fgroup"><label class="label">Detail Alamat Lengkap (Patokan)</label><textarea class="area" maxlength="120" placeholder="Contoh: Dekat masjid, pagar hitam" oninput="setF('aPatokan',this.value)">${esc(f.aPatokan || '')}</textarea></div>
      <div class="card p16 row gap12 mt20"><div class="grow"><div class="b600 small">Atur sebagai alamat utama</div><div class="xs muted">Alamat ini akan otomatis dipilih saat Anda memesan layanan.</div></div>
        <button class="toggle ${f.aUtama || kunci ? 'on' : ''}" onclick="toggleUtama(${kunci})" aria-label="Alamat utama"></button></div>
      </div></div>`,
    bar:`<button class="btn btn-primary" onclick="simpanAlamat(${p.id ? `'${p.id}'` : 'null'})">Simpan Alamat</button>`
  };
};

    ['3. Harga dan Pembayaran','Harga layanan dihitung berdasarkan tarif per jam per helper dikali durasi dan jumlah helper. Pembayaran melalui virtual account atau dompet digital harus diselesaikan dalam batas waktu yang tertera; jika tidak, pesanan dibatalkan otomatis.'],
    ['4. Pembatalan dan Pengembalian Dana','Pembatalan dapat dilakukan sebelum pengerjaan dimulai. Dana pesanan yang sudah dibayar akan dikembalikan ke saldo HMWallet pelanggan.'],
    ['5. Garansi Kebersihan','Jika hasil pengerjaan tidak sesuai standar, pelanggan dapat mengajukan komplain atau garansi paling lambat 24 jam setelah pesanan selesai. Tim HMCLEAN akan meninjau dan menjadwalkan pengerjaan ulang bila diperlukan.'],
    ['6. Kewajiban Pelanggan','Pelanggan wajib menyimpan barang berharga dengan aman, menyediakan akses air dan listrik, serta memperlakukan mitra dengan hormat selama pengerjaan.']]],
  privacy:['Kebijakan Privasi', [

    ['Penggunaan Data','Data digunakan untuk menjadwalkan mitra, mengirim notifikasi status pesanan, memproses pembayaran, serta meningkatkan kualitas layanan HMCLEAN.'],
    ['Berbagi Data dengan Mitra','Mitra hanya menerima informasi yang diperlukan untuk pengerjaan, seperti nama panggilan, alamat, patokan, dan catatan pesanan. Nomor telepon Anda tidak ditampilkan secara langsung kepada mitra.'],
